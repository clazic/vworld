name: release

# git tag v* 푸시(또는 수동 실행) 시 3-OS 네이티브 빌드 → GitHub Releases 자산 게시.
#   - 바이너리는 git 에 두지 않고 CI 가 소스에서 빌드한다.
#   - 자산: vworld-macos(universal) · vworld(arm64) · vworld-linux(x86_64 musl 정적) · vworld-windows.exe · vworld-skill.zip
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: v0.1.0). 비우면 Cargo.toml 버전 사용"
        required: false

permissions:
  contents: read

jobs:
  # ── 1) 3-OS 네이티브 빌드 ──────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'linux' && 'x86_64-unknown-linux-musl' || '' }}
      - uses: Swatinem/rust-cache@v2

      # macOS: arm64 + x64 → lipo universal(vworld-macos) + arm64 사본(vworld)
      - name: Build macOS (universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output vworld-macos \
            target/aarch64-apple-darwin/release/vworld \
            target/x86_64-apple-darwin/release/vworld
          cp target/aarch64-apple-darwin/release/vworld vworld

      # Linux: musl 정적 빌드 — ubuntu-latest 의 최신 glibc(GLIBC_2.39) 요구를 피해 어떤 배포판에서도 실행.
      # rusqlite(bundled)·ring 의 C 코드 컴파일에 musl-gcc 가 필요하다.
      - name: Build Linux (musl static)
        if: runner.os == 'Linux'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/vworld vworld-linux

      - name: 정적 링크 확인 (Linux)
        if: runner.os == 'Linux'
        run: |
          file vworld-linux
          file vworld-linux | grep -Eq 'statically linked|static-pie linked' \
            || { echo "::error::vworld-linux 가 정적 링크가 아닙니다"; exit 1; }

      - name: Build Windows (msvc)
        if: runner.os == 'Windows'
        run: |
          cargo build --release
          copy target\release\vworld.exe vworld-windows.exe

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            vworld-macos
            vworld
          retention-days: 1

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vworld-linux
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vworld-windows.exe
          retention-days: 1

  # ── 2) skill zip 패키징 + Release 게시 ────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Release 생성·자산 업로드
    steps:
      - uses: actions/checkout@v4

      - name: 버전 일치 검증 (tag ↔ Cargo.toml)
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          # 태그 결정: 수동 입력 > tag push 의 ref 이름 > (수동 실행 + 입력 없음) Cargo.toml 버전
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$CARGO_VER"
          fi
          # 입력 검증 (GITHUB_ENV 줄바꿈 주입 방지)
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::잘못된 태그 형식: 'v<숫자>...' 이어야 합니다"; exit 1 ;;
          esac
          if printf '%s' "$TAG" | grep -Eq '[^0-9A-Za-z._+-]'; then
            echo "::error::태그에 허용되지 않는 문자가 있습니다"; exit 1
          fi
          TAG_VER="${TAG#v}"
          echo "Cargo=$CARGO_VER  Tag=$TAG_VER"
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::버전 불일치 — Cargo.toml($CARGO_VER) ≠ tag($TAG_VER)"; exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: 빌드 자산 수집
        uses: actions/download-artifact@v4
        with:
          path: artifacts   # artifacts/{macos,linux,windows}/<파일>

      - name: skill 번들 구성 (루트 평탄 구조)
        run: |
          set -e
          mkdir -p bundle/app bundle/references/data
          # LEARNINGS.md 는 설치 시 1회만 심는다(스킬이 "작업 전 읽어라"라고 지시하는 파일).
          # 업데이트용 vworld-skill-files.zip 에는 넣지 않는다 — 사용자가 append 한 오답노트를 덮어쓰지 않기 위해.
          cp SKILL.md INSTALL.md README.md LEARNINGS.md bundle/ 2>/dev/null || true
          cp app/config.toml.example bundle/app/
          cp artifacts/macos/vworld-macos       bundle/app/
          cp artifacts/macos/vworld             bundle/app/
          cp artifacts/linux/vworld-linux       bundle/app/
          cp artifacts/windows/vworld-windows.exe bundle/app/
          cp -R references/docs bundle/references/docs
          cp references/data/*.tsv bundle/references/data/   # sqlite 제외
          chmod +x bundle/app/vworld bundle/app/vworld-macos bundle/app/vworld-linux
          (cd bundle && zip -r ../vworld-skill.zip .)
          ls -la vworld-skill.zip

      # `vworld update` 전용 경량 스킬 번들 — 바이너리 미포함(자산 수십 MB → 수 MB).
      # 설치용 vworld-skill.zip(바이너리 포함)은 install.sh/ps1 호환을 위해 그대로 유지한다.
      - name: skill 파일 번들 구성 (바이너리 제외)
        run: |
          set -e
          mkdir -p files/references/data
          cp SKILL.md INSTALL.md README.md files/ 2>/dev/null || true
          cp -R references/docs files/references/docs
          cp references/data/*.tsv files/references/data/
          (cd files && zip -r ../vworld-skill-files.zip .)
          ls -la vworld-skill-files.zip

      # 자산 무결성 검증용 — `vworld update` 가 이 파일로 다운로드를 검증한다.
      # 경로를 벗겨 평탄한 파일명만 남긴다(자산명으로 조회하므로).
      - name: SHA256SUMS 생성
        run: |
          set -e
          sha256sum \
            artifacts/macos/vworld-macos \
            artifacts/macos/vworld \
            artifacts/linux/vworld-linux \
            artifacts/windows/vworld-windows.exe \
            vworld-skill.zip \
            vworld-skill-files.zip \
            | sed 's| [^ ]*/| |' > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub Release 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/macos/vworld-macos
            artifacts/macos/vworld
            artifacts/linux/vworld-linux
            artifacts/windows/vworld-windows.exe
            vworld-skill.zip
            vworld-skill-files.zip
            SHA256SUMS
