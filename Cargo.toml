[package]
name = "vworld"
version = "0.5.0"
edition = "2021"
description = "VWorld OpenAPI CLI — 자기완결 단일 바이너리 (kosis 동시성 패턴 차용)"
license = "MIT"

[[bin]]
name = "vworld"
path = "src/main.rs"

[[bin]]
name = "vworld-mcp"
path = "src/bin/vworld-mcp/main.rs"

[lib]
name = "vworld"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-channel = "2"
quick-xml = { version = "0.36", features = ["serialize"] }
anyhow = "1"
thiserror = "1"
shapefile = "0.6"
encoding_rs = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
calamine = "0.26"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# vworld-mcp(MCP 서버) 전용 — stdio + Streamable HTTP(rmcp 내장 세션 관리자).
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
# HTTP 모드 전용(모두 reqwest·rmcp 가 이미 쓰는 크레이트 — 새로 받는 것 없음).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
mockito = "1"

[profile.release]
strip = true
lto = "thin"
